# Cấu hình Mosquitto mẫu cho FarmControl
# Tạo tài khoản:  mosquitto_passwd -c passwd backend   rồi   mosquitto_passwd passwd esp32-01

persistence true
persistence_location /mosquitto/data/

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Cổng nội bộ (mạng LAN / khi phát triển)
listener 1883

# Cổng TLS khi đưa lên Internet (bỏ comment và cấp chứng chỉ)
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
