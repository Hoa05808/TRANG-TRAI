; FarmControl Gateway - ESP32 + RS485 (Modbus RTU) + MQTT
; Build:   pio run          Nạp:  pio run -t upload        Xem log:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    4-20ma/ModbusMaster@^2.0.1
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
